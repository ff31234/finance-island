<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>財務島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D archipelago game; title card + passport HUD top-left, toolbar top-right, logbook panel with 觀念/實驗室/挑戰 tabs docked right (bottom sheet on phones) */
:root{
  --ink:#1b2830; --muted:#55666e; --card:rgba(255,255,255,.88); --card-solid:#ffffff; --rule:rgba(27,40,48,.13);
  --hot:#ff7a45; --gold:#e8b53a; --gold-ink:#5a3e00; --ok:#2f9a5b; --ok-soft:#dff3e6; --no:#d2543f; --no-soft:#fbe3de;
  --a:#7fb85a; --a-soft:#e8f3df; --b:#e3b847; --b-soft:#fbf1d4; --c:#5fb7a6; --c-soft:#dcf2ed;
  --s1:#3f6fb0; --s2:#e3b847; --s3:#d9694a;
  --code:#f1f5f6; --shadow:0 10px 40px rgba(20,40,60,.18); --scrim:rgba(10,22,32,.45); --lock-bg:rgba(232,238,240,.92);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e6eef1; --muted:#9fb2ba; --card:rgba(16,28,36,.88); --card-solid:#101c24; --rule:rgba(230,238,241,.15);
  --ok:#5cc985; --ok-soft:#173826; --no:#f08a72; --no-soft:#3d1f19; --gold-ink:#ffe3a1;
  --a-soft:#1f3020; --b-soft:#33291a; --c-soft:#163029; --s1:#78a6e6;
  --code:#0b151b; --shadow:0 10px 40px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); --lock-bg:rgba(28,40,48,.92); color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e6eef1; --muted:#9fb2ba; --card:rgba(16,28,36,.88); --card-solid:#101c24; --rule:rgba(230,238,241,.15);
  --ok:#5cc985; --ok-soft:#173826; --no:#f08a72; --no-soft:#3d1f19; --gold-ink:#ffe3a1;
  --a-soft:#1f3020; --b-soft:#33291a; --c-soft:#163029; --s1:#78a6e6;
  --code:#0b151b; --shadow:0 10px 40px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); --lock-bg:rgba(28,40,48,.92); color-scheme:dark}

html,body{height:100%;overflow:hidden}
body{background:#cbe9f3;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;overflow:hidden}
.app{position:relative;height:100%;min-height:560px;overflow:hidden}
#sky{position:absolute;inset:0;transition:background 1.4s ease}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:absolute;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.glass{background:var(--card);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--rule);box-shadow:var(--shadow)}
[hidden]{display:none!important}

/* title + HUD */
.titlecard{position:absolute;top:16px;left:max(16px,env(safe-area-inset-left,0px));border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;gap:10px;width:300px}
.tc-top{display:flex;align-items:center;gap:12px}
.seal{width:46px;height:46px;flex:none}
.titlecard h1{font-family:var(--f-display);font-weight:900;font-size:1.85rem;line-height:1;margin:0;letter-spacing:.08em}
.titlecard p{margin:3px 0 0;font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.hud{display:flex;flex-direction:column;gap:7px;border:1px solid var(--rule);background:var(--code);border-radius:12px;padding:9px 12px;text-align:left;width:100%}
.hud:hover{border-color:var(--hot)}
.hud-row{display:flex;align-items:center;gap:10px;font-size:.88rem;flex-wrap:wrap}
.av{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid var(--card-solid);box-shadow:0 0 0 1px var(--rule)}
.hud-name{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;color:var(--muted)}
.stat b{color:var(--ink);font-family:var(--f-mono)}
.stat i{width:12px;height:12px;display:inline-block;font-style:normal}
.coin-i{border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.45)}}
.bar{height:7px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--hot));border-radius:99px;transition:width .6s ease}
.hud-hint{font-size:.76rem;color:var(--muted)}

/* toolbar */
.toolbar{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:min(1000px,calc(100% - 330px))}
.seg{display:flex;border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-size:.9rem;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card-solid)}
.search{position:relative;border-radius:999px;display:flex;align-items:center;padding:0 14px;gap:8px;min-width:210px}
.search svg{flex:none;opacity:.6}
.search input{border:0;background:transparent;outline:0;padding:9px 0;width:100%;font-size:.93rem}
.results{position:absolute;top:calc(100% + 8px);left:0;right:0;border-radius:14px;list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto;z-index:5}
.results button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px;line-height:1.45}
.results button:hover,.results button:focus-visible{background:var(--code)}
.results small{display:block;color:var(--muted);font-size:.8rem}
.results .none{padding:8px 10px;color:var(--muted);font-size:.9rem}

/* map labels */
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);border:0;border-radius:999px;padding:4px 13px 4px 4px;display:flex;align-items:center;gap:7px;font-weight:700;font-size:.92rem;white-space:nowrap;background:var(--card);color:var(--ink);box-shadow:0 4px 14px rgba(20,40,60,.18);transition:transform .2s,background .2s,opacity .2s}
.lbl .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;color:#13201f}
.lbl.got .n{background:var(--gold)!important;box-shadow:0 0 0 2px #fff6d6}
.lbl.on{background:var(--hot);color:#fff;transform:translate(-50%,-100%) scale(1.08)}
.lbl.dim{opacity:.6}
.lbl::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1}
.nametag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;font-size:.78rem;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--ink);color:var(--card-solid);white-space:nowrap}
.tip{position:absolute;pointer-events:none;border-radius:12px;padding:10px 14px;max-width:260px;font-size:.88rem;line-height:1.55;transform:translate(14px,14px);z-index:3}
.tip strong{display:block;font-size:.97rem}
.tip span{color:var(--muted)}

/* panel */
.panel{position:absolute;top:96px;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;width:min(450px,calc(100% - 32px));border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 0 22px;cursor:pointer}
.min-btn{border:1px solid var(--rule);background:var(--card-solid);border-radius:99px;height:36px;padding:0 14px;font-size:.88rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;flex:none}
.min-btn svg{transition:transform .25s}
.panel.min{bottom:auto!important;height:auto!important}
.panel.min .tabs,.panel.min .panel-body{display:none!important}
.panel.min .panel-head{padding-bottom:12px}
.panel.min .min-btn svg{transform:rotate(180deg)}
.panel-head .eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:500;min-width:0}
.icon-btn{border:1px solid var(--rule);background:transparent;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex:none;font-size:1.05rem}
.tabs{display:flex;gap:4px;margin:10px 18px 0;padding:4px;border-radius:14px;background:var(--code)}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 6px;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-selected="true"]{background:var(--card-solid);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tabs .cnt{font-family:var(--f-mono);font-size:.75rem;font-weight:700;border-radius:99px;padding:0 7px;background:var(--rule)}
.tabs .cnt.full{background:var(--gold);color:#3b2a00}
.panel-body{overflow-y:auto;padding:6px 22px 28px;font-size:1.02rem;overscroll-behavior:contain;flex:1}
.panel h2{font-family:var(--f-display);font-weight:900;font-size:1.85rem;line-height:1.25;margin:10px 0 0;text-wrap:balance}
.en{color:var(--muted);font-size:.9rem;margin:2px 0 0;font-style:italic}
.panel h3{font-size:.84rem;letter-spacing:.12em;margin:22px 0 8px;color:var(--muted);font-weight:700}
.panel p{margin:0 0 12px}
.formula{background:var(--code);border-radius:12px;padding:12px 16px;font-family:var(--f-mono);font-size:.96rem;line-height:1.95;overflow-x:auto;display:flex;flex-direction:column}
.blds{display:grid;gap:8px}
.bld{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--rule);background:transparent;border-radius:12px;padding:10px 12px;line-height:1.55}
.bld:hover{border-color:var(--hot)}
.bld i{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:.92rem;background:var(--qs)}
.bld strong{display:block;font-size:.97rem}
.bld span{color:var(--muted);font-size:.9rem}
.links{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.link-btn{display:flex;flex-direction:column;width:100%;text-align:left;border:1px solid var(--rule);background:transparent;border-radius:12px;padding:10px 14px;line-height:1.55}
.link-btn:hover{border-color:var(--hot)}
.link-btn .to{font-weight:700}
.link-btn .why{color:var(--muted);font-size:.92rem}
.next-cta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px;border-radius:14px;padding:14px 16px;background:var(--qs)}
.next-cta p{margin:0;font-size:.95rem}
.btn{border:0;border-radius:12px;padding:10px 18px;background:var(--ink);color:var(--card-solid);font-weight:700;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.gold{background:var(--gold);color:#3b2a00}
.hint{font-size:.9rem;color:var(--muted)}

/* intro */
.steps{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#3b2a00;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem;margin-top:1px}
.steps strong{display:block}
.steps span{color:var(--muted);font-size:.93rem}
.groups{display:grid;gap:10px;margin-top:4px}
.group{border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.group i{flex:none;width:14px;height:14px;border-radius:4px;margin-top:6px}
.group strong{display:block;font-size:1rem}
.group span{font-size:.92rem;color:var(--muted)}

/* lab */
.lab-card{border:1px solid var(--rule);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;margin-top:12px}
.lab-title{font-family:var(--f-display);font-weight:900;font-size:1.3rem;margin:0}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.sl label{font-size:.93rem;font-weight:500}
.sl output{font-family:var(--f-mono);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--hot);height:26px}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.out{background:var(--code);border-radius:12px;padding:10px 12px;min-width:0}
.out small{display:block;color:var(--muted);font-size:.8rem}
.out b{font-family:var(--f-mono);font-size:1.12rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.out.big{background:var(--qs)}
.chart{width:100%;height:190px;display:block}
.msg{border-radius:12px;padding:10px 14px;background:var(--qs);font-size:.95rem;margin:0}
.choice-q{font-weight:700;margin:0}
.choice-opts{display:grid;gap:8px}
.choice-opts button{text-align:left;border:1.5px solid var(--rule);background:transparent;border-radius:12px;padding:10px 14px;line-height:1.55}
.choice-opts button:hover:not(:disabled){border-color:var(--hot)}
.choice-opts button.pick-good{border-color:var(--ok);background:var(--ok-soft)}
.choice-opts button.pick-bad{border-color:var(--no);background:var(--no-soft)}
.ticker{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ticker b{font-family:var(--f-mono);font-size:2rem;font-variant-numeric:tabular-nums}
.ticker .up{color:var(--ok);font-weight:700}.ticker .dn{color:var(--no);font-weight:700}

/* quest */
.quest-head{display:flex;align-items:center;gap:14px;margin-top:12px;border-radius:16px;padding:14px 16px;background:var(--qs)}
.quest-head svg{flex:none}
.quest-head p{margin:0;font-size:.95rem}
.quiz{border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin-top:12px}
.quiz.done{border-color:var(--ok)}
.qq{display:flex;gap:10px;font-weight:700;margin:0 0 10px}
.qn{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--code);font-family:var(--f-mono);font-size:.82rem}
.quiz.done .qn{background:var(--ok);color:#fff}
.opts{display:grid;gap:7px}
.opt{text-align:left;border:1.5px solid var(--rule);background:transparent;border-radius:11px;padding:8px 13px;line-height:1.5;font-size:.97rem}
.opt:hover:not(:disabled){border-color:var(--hot)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.opt.wrong{border-color:var(--no);background:var(--no-soft);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.exp{margin-top:10px;font-size:.93rem;background:var(--ok-soft);border-radius:10px;padding:10px 12px}
.retry{margin-top:8px;font-size:.9rem;color:var(--no)}
.keys{font-family:var(--f-mono);font-size:.84rem;line-height:2.1;overflow-x:auto;margin-top:6px}
.keys b{display:inline-block;border:1px solid var(--rule);background:var(--card-solid);border-radius:6px;padding:0 7px;margin:1px 2px;font-weight:700;box-shadow:0 2px 0 var(--rule)}

/* toast */
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);border-radius:16px;padding:12px 18px;max-width:min(520px,calc(100% - 32px));font-size:.95rem;line-height:1.6;display:flex;gap:12px;align-items:flex-start;z-index:8;animation:rise .35s ease}
.toast strong{display:block}
.toast .x{border:0;background:transparent;font-size:1.1rem;padding:0 4px;color:var(--muted)}
@keyframes rise{from{transform:translate(-50%,20px);opacity:0}}
.floaty{position:absolute;pointer-events:none;font-family:var(--f-mono);font-weight:700;font-size:1.25rem;color:var(--gold);text-shadow:0 2px 0 #7a5400,0 0 10px rgba(255,200,80,.6);animation:fly 1.1s ease-out forwards;z-index:9}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}

/* modals */
.modal{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:10;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{border-radius:22px;padding:24px;width:min(480px,100%);display:flex;flex-direction:column;gap:14px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.sheet h2{font-family:var(--f-display);font-weight:900;font-size:1.7rem;margin:0;text-wrap:balance}
.sheet p{margin:0}
.field label{display:block;font-weight:700;font-size:.92rem;margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--rule);background:var(--card-solid);border-radius:12px;padding:10px 14px;font-size:1rem}
.swatches,.hats{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--rule)}
.sw[aria-pressed="true"]{border-color:var(--card-solid);box-shadow:0 0 0 3px var(--hot)}
.hats button{border:1.5px solid var(--rule);background:transparent;border-radius:99px;padding:6px 14px;font-size:.93rem}
.hats button[aria-pressed="true"]{border-color:var(--hot);background:var(--hot);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.stamp-big{align-self:center;animation:thump .7s cubic-bezier(.2,1.6,.4,1) both;transform:rotate(-8deg)}
@keyframes thump{0%{transform:scale(2.4) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.pp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pp{border:1.5px dashed var(--rule);background:transparent;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;line-height:1.3;min-width:0}
.pp small{font-size:.75rem;color:var(--muted)}
.pp span{font-size:.85rem;font-weight:700}
.pp.got{border-style:solid;border-color:var(--gold);background:var(--b-soft)}
.cert{border:3px double var(--gold);border-radius:16px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;background:var(--b-soft)}
.cert .who{font-family:var(--f-display);font-weight:900;font-size:2rem}
.cert .ttl{font-family:var(--f-display);font-weight:900;font-size:1.25rem;letter-spacing:.3em;color:var(--gold-ink)}
.cert-stamps{display:flex;justify-content:center;flex-wrap:wrap;gap:4px}

/* list */
.list{position:absolute;inset:0;padding:180px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:4}
.list-grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{border-radius:18px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .top{display:flex;align-items:center;gap:10px}
.card .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;color:#13201f;flex:none}
.card strong{font-size:1.08rem}
.card small{color:var(--muted);font-size:.82rem}
.card p{margin:0;font-size:.9rem;color:var(--muted)}
.card .st{font-size:.82rem;font-weight:700;color:var(--gold-ink)}

.help{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;border-radius:999px;padding:7px 16px;font-size:.82rem;color:var(--muted)}

/* locked + bridges */
.lbl.locked{background:var(--lock-bg);color:var(--muted);font-weight:500}
.lbl.locked .n{background:var(--rule)!important;color:var(--muted)}
.bmark{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:var(--hot);color:#fff;font-weight:900;font-size:.85rem;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:bob 1.6s ease-in-out infinite;padding:0}
@keyframes bob{50%{transform:translate(-50%,-64%)}}
.review-btn{border:0;border-radius:999px;padding:0 18px;background:var(--gold);color:#3b2a00;font-weight:900;font-size:.95rem;box-shadow:var(--shadow);min-height:42px;white-space:nowrap}
.review-btn:hover{filter:brightness(1.06)}
.locked-card{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.countdown{font-family:var(--f-mono);font-size:2.4rem;font-weight:700;line-height:1.1;margin-right:4px}
.status{margin-top:12px;border-radius:12px;padding:10px 14px;background:var(--code);font-size:.93rem}
.timeline{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.timeline li{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;font-size:.88rem;padding:6px 10px;border-radius:10px;background:var(--code)}
.timeline li.off{opacity:.6}
.timeline .d{font-family:var(--f-mono);font-weight:700}
.timeline .s{font-size:.78rem;color:var(--muted)}
.sheet h3{margin:4px 0 -4px;font-size:.9rem;letter-spacing:.08em;color:var(--muted)}
/* flashcards */
.fc{perspective:1000px;height:230px;cursor:pointer;margin-top:12px;outline-offset:4px}
.fc-in{position:relative;height:100%;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--rule);overflow:auto}
.fc-front{background:var(--qs)}
.fc-back{background:var(--card-solid);transform:rotateY(180deg);font-size:1.05rem;line-height:1.8}
.fc-front strong{font-family:var(--f-display);font-weight:900;font-size:1.7rem;line-height:1.3}
.fc-face small{color:var(--muted);font-size:.82rem}
.fc-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--rule)}
.dots i.ok{background:var(--ok)}.dots i.cur{box-shadow:0 0 0 2px var(--hot)}
/* review quiz */
.rv-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.num{display:flex;gap:8px;align-items:center}
.num input{flex:1;min-width:0;border:1.5px solid var(--rule);background:var(--card-solid);border-radius:12px;padding:10px 14px;font-family:var(--f-mono);font-size:1.1rem}
.num span{font-weight:700}
.res-ok,.res-no{border-radius:12px;padding:10px 14px;font-size:.95rem;line-height:1.7}
.res-ok{background:var(--ok-soft)}.res-no{background:var(--no-soft)}
.score{font-family:var(--f-display);font-size:3.2rem;font-weight:900;text-align:center;line-height:1}
/* shop */
.shop-btn{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold),var(--shadow)}
.shop-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.shop-it{border:1.5px solid var(--rule);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.shop-it.eq{border-color:var(--hot);background:var(--b-soft)}
.shop-it .ic{width:58px;height:58px;display:grid;place-items:center}
.shop-it .ic svg{width:100%;height:100%}
.shop-it .sw-big{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 1px var(--rule)}
.shop-it strong{font-size:.95rem}
.shop-it small{font-size:.76rem;color:var(--muted);min-height:2.6em;line-height:1.35}
.btn.sm{padding:6px 10px;font-size:.84rem;width:100%}
.btn:disabled{opacity:.55;cursor:default}
.wallet{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:700;font-size:1.1rem;background:var(--code);border-radius:99px;padding:4px 12px}
@media (max-width:480px){.shop-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* RPG */
.lv{flex:none;font-family:var(--f-mono);font-weight:700;font-size:.78rem;border-radius:7px;padding:1px 7px;background:#5b3fa0;color:#fff}
.xprow{display:flex;flex-direction:column;gap:4px}
.bar.xp>span{background:linear-gradient(90deg,#8a5cc2,#5fb7a6)}
.q-btn{position:relative}
.q-btn .dot{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--no);border:2px solid var(--card-solid)}
.tracker{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:3px;text-align:left;width:300px;border:1px solid var(--rule)}
.tracker:hover{border-color:var(--hot)}
.tk-tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:#5b3fa0}
.tracker strong{font-size:1rem}
.tk-goal{font-size:.86rem;color:var(--muted)}
.tk-claim{font-size:.84rem;font-weight:700;color:var(--hot)}
.tk-daily{font-size:.78rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:5px;margin-top:3px}
.qlist{display:grid;gap:8px;max-height:min(52vh,470px);overflow:auto;padding:2px}
.qrow{border:1px solid var(--rule);border-radius:14px;padding:12px 14px;display:grid;gap:7px}
.qrow.done{opacity:.72}.qrow.todo{opacity:.5}
.qrow.cur{border-color:var(--hot);background:var(--b-soft)}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.qhead strong{font-size:1rem}
.qtag{font-size:.74rem;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--code);white-space:nowrap}
.qtag.ok{background:var(--ok);color:#fff}
.npc{display:flex;gap:10px;align-items:flex-start;background:var(--card-solid);border-radius:12px;padding:10px 12px;font-size:.93rem;line-height:1.65}
.npc svg{flex:none}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.btn.xs{padding:5px 12px;font-size:.84rem}
.bt-top{display:flex;gap:14px;align-items:center}
.bt-boss{flex:none}
.bt-boss.hit{animation:shake .4s}
.hpbar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden;margin:5px 0 2px}
.hpbar>span{display:block;height:100%;background:linear-gradient(90deg,#d2543f,#ff9a5c);transition:width .5s ease}
.bt-me{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--code);border-radius:12px;padding:8px 12px;font-size:.9rem}
.hearts{display:inline-flex;gap:3px}
.bt-items{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{border:1.5px solid var(--rule);background:var(--card-solid);border-radius:99px;padding:3px 10px;font-size:.8rem;font-weight:500}
.chip-btn:disabled{opacity:.45;cursor:default}
.hintbox{background:var(--b-soft);border-radius:12px;padding:10px 14px;font-size:.92rem;font-family:var(--f-mono)}
.boss-lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);border:0;border-radius:12px;padding:5px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.3;background:#2b1d3a;color:#fff;font-weight:700;font-size:.86rem;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap}
.boss-lbl small{font-size:.72rem;font-weight:500;opacity:.85}
.boss-lbl.ready{background:#c0392b}.boss-lbl.ready small{opacity:1}
.boss-lbl.won{background:var(--gold);color:#3b2a00}
.big-lv{font-family:var(--f-display);font-weight:900;font-size:3rem;text-align:center;line-height:1;color:#5b3fa0}
/* character */
.radar{display:block;margin:0 auto;max-width:100%}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.statgrid div{background:var(--code);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.9rem}
.statgrid b{font-family:var(--f-mono);font-size:1.05rem}
.jobgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.job{border:1.5px solid var(--rule);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center;min-width:0}
.job.on{border-color:var(--hot);background:var(--b-soft)}
.job strong{font-size:.98rem}.job small{font-size:.76rem;color:var(--muted);line-height:1.4}
.skill{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border:1px solid var(--rule);border-radius:12px;padding:8px 12px}
.skill small{color:var(--muted);font-size:.8rem;grid-column:1}
.pips{display:flex;gap:4px}.pips i{width:12px;height:12px;border-radius:3px;background:var(--rule)}.pips i.on{background:#8a5cc2}
@media (max-width:480px){.jobgrid{grid-template-columns:1fr}}
/* NPC + commissions */
.npc-mark{position:absolute;left:0;top:0;transform:translate(-50%,-100%);width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:var(--gold);color:#3b2a00;font-weight:900;font-size:1.05rem;box-shadow:0 4px 12px rgba(0,0,0,.25);animation:bob2 1.4s ease-in-out infinite;padding:0}
.npc-mark.q{background:#3f6fb0;color:#fff}
@keyframes bob2{50%{transform:translate(-50%,-118%)}}
.dlg-who{display:flex;gap:12px;align-items:center}
.dlg-who strong{font-size:1.1rem}.dlg-who small{display:block;color:var(--muted);font-size:.8rem}
.bubble{background:var(--code);border-radius:4px 16px 16px 16px;padding:12px 15px;line-height:1.8;animation:rise .3s ease}
.rar{font-size:.74rem;font-weight:700;border-radius:99px;padding:1px 9px;white-space:nowrap}
.rar.r1{background:var(--code)}.rar.r2{background:#3f6fb0;color:#fff}.rar.r3{background:var(--gold);color:#3b2a00}
.qbox{border:1px solid var(--rule);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
@media (min-width:861px) and (max-width:1300px){.panel{top:152px}}
@media (max-width:860px){
  .titlecard{padding:10px 12px;gap:8px;width:auto;right:max(16px,env(safe-area-inset-right,0px))}
  .seal{width:34px;height:34px}.titlecard h1{font-size:1.35rem}.titlecard p,.hud-hint,.help,.tracker{display:none}
  .boss-lbl{font-size:.74rem;padding:3px 8px}
  .tc-top{gap:10px}
  .hud{flex-direction:row;align-items:center;padding:6px 10px}.hud .bar{display:none}
  .toolbar{top:134px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:none;justify-content:flex-start;gap:6px}
  .search{flex:1 1 100%;min-width:0}
  .seg button{padding:5px 10px;font-size:.84rem}
  .panel{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;height:50%;bottom:12px}
  .lbl{font-size:.78rem;padding:3px 9px 3px 3px}.lbl .n{width:20px;height:20px;font-size:.68rem}
  .list{padding-top:240px}
  .review-btn{min-height:36px;padding:0 14px;font-size:.86rem}
  .tabs{margin:8px 12px 0}.tabs button{font-size:.86rem;padding:7px 2px}
  .toast{bottom:calc(50% + 24px)}
}
@media (max-width:420px){.tabs .cnt{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  a:{name:"公司目標群島",grass:"#8cc265",roof:"#d9694a",css:"--a",soft:"--a-soft",desc:"財務管理要做哪些決策，又該用什麼標準判斷決策的好壞。"},

 {id:1,q:0,r:0,g:"a",nm:"角色與目標",wk:"第2週 · 09/24",title:"財務管理的角色與目標",en:"The Role and Objective of Financial Management",
  items:[["lighthouse","股東財富極大化","所有財務決策共同的目標，用股價來衡量。"],["tower","投資決策","決定公司要把資金投入哪些資產與計畫。"],["bank","融資決策","決定資金要向債權人借，還是向股東募集，以及兩者的比例。"],["house","股利決策","決定盈餘要發給股東，還是保留下來再投資。"]],

 {id:2,q:1,r:0,g:"a",nm:"代理問題",wk:"第3週 · 10/01",title:"股東財富極大化與代理問題",en:"Maximizing Shareholders' Wealth and Agency Problem",
  items:[["tower","經理人","受股東委託經營公司，掌握日常的決策權。"],["house","股東","公司的所有者，承擔最後的風險，也享有剩餘的報酬。"],["lighthouse","董事會監督","代表股東監督經理人，可以任免經理人並決定其薪酬。"],["coins","股票激勵","用認股權或限制型股票，讓經理人的報酬和股價同步。"],["flag","代理成本","監督與約束經理人所花的成本，以及經理人偏離目標造成的損失。"]],
  body:["股東財富等於每股股價乘上流通在外股數。對掛牌公司來說，股價就是市場對公司未來所有現金流量的評價，經理人如果做了好的決策，最後應該會反映在股價上。","不過公司的經營權在經理人手上，所有權在股東手上，兩邊的利益不一定一致。經理人可能偏好氣派的辦公室，可能為了擴大規模而接下報酬不佳的投資，也可能為了保住職位而迴避有價值但風險較高的計畫，這就是代理問題。股東為了監督經理人所付出的成本，統稱為代理成本。","常見的解決方式包括把經理人的報酬和股價連結，強化董事會的監督功能，以及公司經營不善時被併購接管的壓力。"],
  f:["股東財富 = 每股股價 × 流通在外股數"],
  fact:["代理理論的起點","代理理論最經典的論文，是 Jensen 與 Meckling 在 1976 年發表於 Journal of Financial Economics 的研究，也是財務學被引用次數最多的論文之一。"]},
 {id:3,q:-1,r:1,g:"b",nm:"單利與複利",wk:"第4週 · 10/08",title:"單利與複利",en:"Simple Interest and Compound Interest",
  items:[["windmill","複利","利息併入本金繼續生利息，期數愈長效果愈驚人。"],["house","單利","只有本金生利息，每一期的利息都一樣。"],["coins","利滾利","在複利之下，利息本身也會產生利息。"],["flag","72 法則","用 72 除以年利率的百分比數字，可以約略估算本金翻倍需要幾年。"]],
  body:["單利只對本金計息，所以每一期的利息都一樣。複利會把前一期的利息併入本金，下一期連利息也一起生利息，也就是大家常說的利滾利。","期數短的時候，兩者的差距不大。期數一拉長，複利的效果會愈來愈明顯，這也是長期投資特別強調及早開始的原因。後面所有關於時間價值的計算，都建立在複利這個基礎上。"],
  f:["單利　FV = PV × (1 + i × n)","複利　FV = PV × (1 + i)ⁿ"],
  fact:["那句名言是誰說的","「複利是世界第八大奇蹟」這句話流傳很廣，常被說成是愛因斯坦講的，但其實一直找不到可靠的出處。"]},
 {id:4,q:0,r:1,g:"b",nm:"終值與現值",wk:"第5週 · 10/15",title:"終值與現值",en:"Future Value and Present Value",
  items:[["tower","終值","今天的錢在 n 期之後的價值。"],["house","現值","未來的錢折回今天的價值。"],["lighthouse","折現率","把未來折回現在所用的利率，反映機會成本與風險。"],["coins","期數","期數愈長，終值愈大、現值愈小。"]],
  body:["終值是把今天的錢往未來推，回答的是這筆錢放到 n 年後會變成多少。現值則反過來，把未來的錢折回今天，回答的是未來的這筆錢相當於今天的多少錢。把未來折回現在的過程稱為折現，使用的利率稱為折現率。","現值是整門財務學最核心的工具。評估一項投資值不值得做，或是決定一張債券、一張股票值多少錢，做法都是把未來的現金流量一一折回今天再加總。折現率愈高、期數愈長，現值就愈小。"],
  f:["FV = PV × (1 + i)ⁿ","PV = FV ÷ (1 + i)ⁿ"],
  fact:["24 美元買下曼哈頓","據說荷蘭人在 1626 年用價值約 24 美元的貨物換到曼哈頓島。如果這 24 美元以年利率 6% 複利到 2026 年，會變成大約 3,181 億美元。"]},
 {id:5,q:-1,r:2,g:"b",nm:"年金",wk:"第6週 · 10/22",title:"年金",en:"Annuities",
  items:[["bank","年金現值","一連串等額收付折回今天的總價值，可以用來算貸款金額或月付額。"],["house","普通年金","每期期末收付，例如多數的房貸。"],["house","期初年金","每期期初收付，例如房租與保費。"],["coins","年金終值","一連串等額存款在到期時累積的總額。"]],
  body:["年金是每期金額相同、間隔相同的一連串現金流量，例如每月的房貸、每年的保費，或是定期定額的存款。只要符合這兩個條件，就不需要一期一期分別折現，可以用年金公式一次算完。","年金分成兩種。每期期末收付的稱為普通年金，也叫期末年金。每期期初收付的稱為期初年金。期初年金的每一筆都比期末年金早一期，多賺一期利息，所以把普通年金的結果再乘上 (1 + i) 就是期初年金。使用財務計算機時，記得先確認設定是 End 還是 Begin。"],
  f:["FVA = PMT × [(1 + i)ⁿ − 1] ÷ i","PVA = PMT × [1 − (1 + i)⁻ⁿ] ÷ i","期初年金 = 普通年金 × (1 + i)"],
  fact:["勞保老年年金","勞保的老年年金是按月領取的固定金額，就是生活中最常見的年金。要比較一次請領和按月領哪個划算，用的正是年金現值。"]},
 {id:6,q:0,r:2,g:"b",nm:"有效利率",wk:"第9週 · 11/12",title:"複利期間與有效利率",en:"Compounding Periods and Effective Interest Rate",
  items:[["tower","有效年利率 EAR","考慮一年內複利次數之後，實際的年利率。"],["windmill","計息次數","一年計息 m 次，每期利率就是 APR ÷ m。"],["flag","名目年利率 APR","銀行公告的年利率，還沒有考慮一年內計息幾次。"]],
  body:["銀行公告的年利率通常是名目年利率，也就是 APR，但實際計息可能是每半年、每季甚至每月一次。一年內計息的次數愈多，利息滾入本金的次數就愈多，一年下來實際的利率會比名目利率高，這個實際利率就是有效年利率，也就是 EAR。","比較不同計息方式的存款或貸款時，要先換算成有效年利率才公平。另外，一年計息多次時，終值、現值與年金公式也要跟著調整，每期利率改成 APR ÷ m，期數改成 n × m。"],
  f:["EAR = (1 + APR ÷ m)ᵐ − 1","每期利率 = APR ÷ m　總期數 = n × m"],
  fact:["信用卡循環利率","依照銀行法，台灣信用卡循環信用的年利率上限是 15%。卡債如果一直滾下去，實際負擔的利率會比公告的數字更高。"]},
 {id:7,q:1,r:1,g:"c",nm:"金融市場",wk:"第10、12週 · 11/19、12/03",title:"金融市場",en:"Financial Market Place",
  items:[["bank","資本市場","交易一年以上長期工具的市場，例如股票與公司債。"],["stall","貨幣市場","交易一年以內短期工具的市場，例如國庫券與商業本票。"],["stall","初級與次級市場","初級市場是第一次發行募資，次級市場是投資人之間的買賣。"],["house","金融中介","銀行、保險公司等機構，把資金從存款人手上轉給需要資金的人。"],["lighthouse","利率的組成","名目利率由實質利率、通膨溢酬與風險溢酬組成。"]],
  body:["金融市場是資金從有餘的一方，流向需要資金的一方的地方。依到期期限區分，一年以內的短期工具在貨幣市場交易，例如國庫券與商業本票。一年以上的長期工具在資本市場交易，例如股票與公司債。依交易性質區分，公司第一次發行證券募集資金的是初級市場，投資人之間買賣已發行證券的是次級市場。","資金也可以不直接經過市場，而是透過銀行、保險公司等金融中介機構間接移轉。利率就是資金的價格，名目利率可以拆成實質利率、通貨膨脹溢酬與各種風險溢酬。市場上決定的這個利率，就是我們在終值與現值計算裡使用的折現率。"],
  f:["名目利率 ≈ 實質無風險利率 + 通膨溢酬 + 風險溢酬"],
  fact:["台灣證券交易所","臺灣證券交易所在 1961 年成立，1962 年正式開業，到今天已經超過一甲子。"]},
 {id:8,q:2,r:0,g:"c",nm:"績效評估",wk:"第13週 · 12/10",title:"財務績效評估",en:"Evaluation of Financial Performance",
  items:[["tower","杜邦分析","把 ROE 拆成淨利率、總資產週轉率與權益乘數。"],["house","資產負債表","某一個時點，公司擁有什麼、欠了什麼。"],["house","損益表","一段期間的營收、成本與獲利。"],["windmill","現金流量表","現金實際從哪裡來、又用到哪裡去。"],["chart","趨勢與同業比較","和自己的過去比，也和同業比，才看得出好壞。"]],
  body:["評估一家公司表現好不好，主要的資料來源是三張財務報表。資產負債表呈現某一個時點的資產、負債與權益。損益表呈現一段期間的營收與獲利。現金流量表說明現金實際從哪裡來、又用到哪裡去。","只看一個數字很難判斷好壞，所以需要比較。和公司自己過去幾年比較，叫做趨勢分析。和同產業的其他公司比較，叫做同業比較。杜邦分析把股東權益報酬率拆成獲利能力、資產使用效率與財務槓桿三個部分，可以看出 ROE 的高低究竟是由哪一部分造成的。"],
  f:["ROE = 淨利率 × 總資產週轉率 × 權益乘數","　 = (淨利 ÷ 營收) × (營收 ÷ 總資產) × (總資產 ÷ 權益)"],
  fact:["杜邦分析的名字","杜邦分析的名字來自美國杜邦公司。這套拆解 ROE 的方法是杜邦公司內部發展出來的管理工具，1920 年代之後才廣為流傳。"]},
 {id:9,q:2,r:1,g:"c",nm:"財務比率",wk:"第14週 · 12/17",title:"財務比率分類與解讀",en:"Financial Ratio Classifications and Interpretation",
  items:[["tower","負債管理比率","負債比率、利息保障倍數，看財務槓桿與長期償債能力。"],["chart","流動性比率","流動比率、速動比率，看短期償債能力。"],["chart","資產管理比率","存貨週轉率、應收帳款收現天數，看資產的使用效率。"],["coins","獲利能力比率","ROA、ROE、淨利率，看公司賺錢的本事。"],["bank","市場價值比率","本益比、股價淨值比，結合股價看市場的評價。"]],
  body:["財務比率依用途大致可以分成五類。流動性比率看短期償債能力，例如流動比率與速動比率。資產管理比率看資產的使用效率，例如存貨週轉率與應收帳款收現天數。負債管理比率看財務槓桿與長期償債能力，例如負債比率與利息保障倍數。獲利能力比率看公司賺錢的本事，例如 ROA 與 ROE。市場價值比率則把股價放進來，例如本益比與股價淨值比。","比率本身沒有絕對的好壞。流動比率太低，可能代表付不出短期債務。太高，則可能表示現金或存貨閒置過多。解讀時要放回產業特性和公司的發展階段一起看。"],
  f:["流動比率 = 流動資產 ÷ 流動負債","速動比率 = (流動資產 − 存貨) ÷ 流動負債"],
  fact:["流動比率一定要大於 2 嗎","「流動比率最好在 2 倍以上」是很常聽到的經驗法則。不過像便利商店這種每天收現金、存貨流轉很快的行業，流動比率低於 1 也不一定代表有危險。"]}
];

function wireCards(i){
  const cs=cardList(i),fc=$("#fc");let k=cs.findIndex((_,j)=>!S.cards[i.id+"-"+j]);if(k<0)k=0;
  const draw=()=>{fc.classList.remove("flip");const c=cs[k];
    $("#fc-f").innerHTML=`<small>第 ${k+1} 張 · ${c[2]}</small><strong>${c[0]}</strong><small>點一下翻面</small>`;
    setTimeout(()=>{$("#fc-b").innerHTML=`<div>${c[1]}</div>`},180);
    $("#fc-pos").textContent=`已記住 ${cardsDone(i.id)} / ${cs.length} 張`;
    $("#fc-dots").innerHTML=cs.map((_,j)=>`<i class="${S.cards[i.id+"-"+j]?"ok":""} ${j===k?"cur":""}"></i>`).join("");
    if(k<i.items.length&&api)api.pulse(i.id,k)};
  const flip=()=>{fc.classList.toggle("flip");sfx.tap()};
  fc.addEventListener("click",flip);fc.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
  const next=()=>{for(let st=1;st<=cs.length;st++){const j=(k+st)%cs.length;if(!S.cards[i.id+"-"+j]){k=j;return draw()}}k=(k+1)%cs.length;draw()};
  $("#fc-ok").addEventListener("click",()=>{const before=cardsDone(i.id),was=S.cards[i.id+"-"+k];S.cards[i.id+"-"+k]=1;day().cards++;save();tabCount(i);if(!was)gainXP(S.job==="ana"?10:5);
    if(before<cs.length&&cardsDone(i.id)===cs.length){addCoins(30);gainXP(30);toast("卡片全部記住了",`<span>第 ${i.id} 島的 ${cs.length} 張卡片都記住了，獲得 30 金幣。</span>`)}else sfx.tap();next()});
  $("#fc-again").addEventListener("click",()=>{delete S.cards[i.id+"-"+k];day().cards++;save();renderTracker();tabCount(i);next()});
  draw();
}

function bridgeQuiz(n){
  const br=B[n],a=byId[br[0]],b=byId[br[1]];
  const opts=[n,(n+3)%B.length,(n+7)%B.length].sort((x,y)=>((x*5+n*3)%7)-((y*5+n*3)%7));
  modal(`<h2>修橋任務</h2><p>第 ${a.id} 島「${a.nm}」和第 ${b.id} 島「${b.nm}」之間的吊橋壞掉了。選出這兩個單元之間真正的關係，就能把橋修好。</p>
   <div class="opts">${opts.map(o=>`<button class="opt" data-o="${o}">${B[o][2]}</button>`).join("")}</div>
   <p class="retry" id="bq-r" hidden>這句話說的是另外兩座島的關係，再想想看。</p>
   <div class="row"><button class="btn ghost" id="bq-x">先不修</button></div>`);
  $("#bq-x").addEventListener("click",closeModal);
  $("#sheet").querySelectorAll(".opt").forEach(x=>x.addEventListener("click",e=>{
    if(+x.dataset.o===n){x.classList.add("right");$("#sheet").querySelectorAll(".opt").forEach(y=>y.disabled=true);$("#bq-r").hidden=true;
      S.fixed[n]=1;save();addCoins(20,e.clientX,e.clientY);gainXP(40);if(api)api.repair(n);
      setTimeout(()=>{closeModal();toast("吊橋修好了",`<span>第 ${a.id} 島和第 ${b.id} 島之間可以安全通行了，獲得 20 金幣。</span>`);if(sel)renderPanel()},900)}
    else{x.classList.remove("wrong");void x.offsetWidth;x.classList.add("wrong");x.disabled=true;$("#bq-r").hidden=false;sfx.wrong()}}));
}

const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const fmt=v=>v.toLocaleString("zh-TW");
const SUPS={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻"};
const sup=n=>String(n).split("").map(c=>SUPS[c]||c).join("");
const GEN={
 2:()=>{const p=RI(30,120),sh=RI(10,50)*100,a=p*sh/1e4;return{q:`某公司股價 ${p} 元，流通在外 ${fmt(sh)} 萬股，股東財富是多少億元？`,a,u:"億元",d:2,how:`股東財富 = ${p} × ${fmt(sh)} 萬股 = ${a.toFixed(2)} 億元。`}},
 3:()=>{const pv=RI(10,50)*1000,i=RI(2,8),n=RI(2,10),c=Math.random()<.65,a=c?pv*Math.pow(1+i/100,n):pv*(1+i/100*n);
   return{q:`存入 ${fmt(pv)} 元，年利率 ${i}%，以${c?"複利":"單利"}計算，${n} 年後的本利和是多少元？`,a,u:"元",d:2,
     how:c?`FV = ${fmt(pv)} × ${(1+i/100).toFixed(2)}${sup(n)} = ${money(a)} 元。`:`FV = ${fmt(pv)} × (1 + ${(i/100).toFixed(2)} × ${n}) = ${money(a)} 元。`,
     keys:c?[["CMPD"],"n",""+n,"I%",""+i,"PV","-"+pv,"PMT","0","FV","SOLVE"]:null}},
 4:()=>{const fv=RI(5,50)*10000,i=RI(2,9),n=RI(2,12),a=fv/Math.pow(1+i/100,n);
   return{q:`${n} 年後可以拿到 ${fmt(fv)} 元，折現率 ${i}%，這筆錢的現值是多少元？`,a,u:"元",d:2,how:`PV = ${fmt(fv)} ÷ ${(1+i/100).toFixed(2)}${sup(n)} = ${money(a)} 元。`,
     keys:[["CMPD"],"n",""+n,"I%",""+i,"PMT","0","FV",""+fv,"PV","SOLVE"]}},
 5:()=>{const p=RI(5,30)*1000,i=RI(2,8),n=RI(3,15),k=RI(0,2),r=i/100,f=(1+r).toFixed(2),fva=p*(Math.pow(1+r,n)-1)/r,pva=p*(1-Math.pow(1+r,-n))/r;
   if(k===0)return{q:`每年年底存入 ${fmt(p)} 元，年利率 ${i}%，連續存 ${n} 年，第 ${n} 年底一共會有多少元？`,a:fva,u:"元",d:2,how:`普通年金終值 = ${fmt(p)} × (${f}${sup(n)} − 1) ÷ ${r.toFixed(2)} = ${money(fva)} 元。`,keys:[["CMPD"],"Set: End","n",""+n,"I%",""+i,"PV","0","PMT","-"+p,"FV","SOLVE"]};
   if(k===1)return{q:`未來 ${n} 年，每年年底可以領 ${fmt(p)} 元，年利率 ${i}%，這筆年金的現值是多少元？`,a:pva,u:"元",d:2,how:`普通年金現值 = ${fmt(p)} × (1 − ${f}${sup(-n)}) ÷ ${r.toFixed(2)} = ${money(pva)} 元。`,keys:[["CMPD"],"Set: End","n",""+n,"I%",""+i,"PMT",""+p,"FV","0","PV","SOLVE"]};
   return{q:`每年年初存入 ${fmt(p)} 元，年利率 ${i}%，連續存 ${n} 年，第 ${n} 年底一共會有多少元？`,a:fva*(1+r),u:"元",d:2,how:`期初年金終值 = 普通年金終值 ${money(fva)} × ${f} = ${money(fva*(1+r))} 元。`,keys:[["CMPD"],"Set: Begin","n",""+n,"I%",""+i,"PV","0","PMT","-"+p,"FV","SOLVE"]}},
 6:()=>{const apr=RI(2,9)*2,mi=RI(0,2),m=[2,4,12][mi],a=(Math.pow(1+apr/100/m,m)-1)*100;
   return{q:`名目年利率 ${apr}%，${["每半年","每季","每月"][mi]}複利一次，有效年利率是多少？`,a,u:"%",d:2,how:`EAR = (1 + ${apr}% ÷ ${m})${sup(m)} − 1 = ${a.toFixed(2)}%。`,keys:[["CNVR"],"n",""+m,"I%",""+apr,"EFF","SOLVE"]}},
 7:()=>{const r=RI(2,12)*.25,f=RI(2,14)*.25,k=RI(2,20)*.25,a=r+f+k;
   return{q:`實質無風險利率 ${r.toFixed(2)}%、通膨溢酬 ${f.toFixed(2)}%、違約與流動性風險溢酬 ${k.toFixed(2)}%，這張公司債的名目利率大約是多少？`,a,u:"%",d:2,how:`${r.toFixed(2)}% + ${f.toFixed(2)}% + ${k.toFixed(2)}% = ${a.toFixed(2)}%。`}},
 8:()=>{const npm=RI(2,15),tat=RI(5,20)/10,em=RI(10,40)/10,a=npm*tat*em;
   return{q:`某公司淨利率 ${npm}%、總資產週轉率 ${tat.toFixed(1)} 次、權益乘數 ${em.toFixed(1)} 倍，ROE 是多少？`,a,u:"%",d:2,how:`ROE = ${npm}% × ${tat.toFixed(1)} × ${em.toFixed(1)} = ${a.toFixed(2)}%。`}},
 9:()=>{const cl=RI(4,16)*50,ca=RI(6,30)*50,inv=RI(1,Math.max(1,Math.floor(ca/100)))*50,qk=Math.random()<.5,a=qk?(ca-inv)/cl:ca/cl;
   return{q:`某公司流動資產 ${ca} 萬元，其中存貨 ${inv} 萬元，流動負債 ${cl} 萬元，${qk?"速動比率":"流動比率"}是多少倍？`,a,u:"倍",d:2,how:qk?`速動比率 = (${ca} − ${inv}) ÷ ${cl} = ${a.toFixed(2)}。`:`流動比率 = ${ca} ÷ ${cl} = ${a.toFixed(2)}。`}}
};
function tolOK(x,it){const a=Math.abs(it.a),tol=it.u==="元"?Math.max(1,a*1e-5):it.u==="%"?0.02:Math.max(.01,a*1e-3);return Math.abs(Math.abs(x)-a)<=tol+1e-9}
function pickReview(){
  const ids=I.filter(i=>isOpen(i.id)).map(i=>i.id),out=[],used=new Set();
  for(let g=0;out.length<5&&g<80;g++){const id=ids[RI(0,ids.length-1)];
    if(GEN[id]&&Math.random()<.6)out.push(Object.assign({t:"gen",id},GEN[id]()));
    else{const k=RI(0,2),key=id+"-"+k;if(used.has(key))continue;used.add(key);out.push({t:"mc",id,k,key})}}
  return out;
}
function review(items,title){
  if(!nOpen()){toast("還沒有開放的島","<span>上完第一週的課之後再來抽考吧。</span>");return}
  items=items||pickReview();const total=items.length,book=!!title;let idx=0,score=0;
  const finish=()=>{const perfect=score===total;day().review++;if(perfect&&!book){S.coins+=20;S.st.perfect++}save();hud("co");perfect?sfx.stamp():sfx.coin();
    modal(`<h2 style="text-align:center">${perfect?"全部答對":"抽考結束"}</h2><div class="score">${score} / ${total}</div>
      <p style="text-align:center">${perfect?(book?"錯題全部練會了。":"全部答對，額外獲得 20 金幣。"):"答錯的題目已經收進錯題本，之後可以從護照裡再練一次。"}</p>
      ${S.wrong.length?`<p class="hint" style="text-align:center">錯題本目前有 ${S.wrong.length} 題</p>`:""}
      <div class="row" style="justify-content:center">${S.wrong.length?`<button class="btn ghost" id="rv-wb">練習錯題</button>`:""}<button class="btn ghost" id="rv-x">關閉</button><button class="btn" id="rv-again">再抽一次</button></div>`);
    $("#rv-x").addEventListener("click",closeModal);$("#rv-again").addEventListener("click",()=>review());const wb=$("#rv-wb");if(wb)wb.addEventListener("click",wrongBook);
    if(sel)renderPanel()};
  const show=()=>{
    const it=items[idx],i=byId[it.id];
    let body;
    if(it.t==="mc"){const q=Q[it.id][it.k];body=`<p style="font-weight:700">${q[0]}</p><div class="opts">${q[1].map((o,j)=>`<button class="opt" data-o="${j}">${o}</button>`).join("")}</div>`}
    else body=`<p style="font-weight:700">${it.q}</p><div class="num"><input id="rv-in" inputmode="decimal" placeholder="輸入答案" autocomplete="off" aria-label="答案"><span>${it.u}</span><button class="btn" id="rv-go">送出</button></div><p class="hint" style="margin:0">四捨五入到小數第 ${it.d} 位，金額不用打逗號。拿出 FC-100V 算算看。</p>`;
    modal(`<div class="rv-top"><span>${title||"隨機抽考"} · 第 ${idx+1} / ${total} 題</span><span>出自第 ${it.id} 島 ${i.nm}</span></div><div class="bar"><span style="width:${idx/total*100}%"></span></div>
      ${body}<div id="rv-res"></div><div class="row"><button class="btn ghost" id="rv-quit">結束</button><button class="btn" id="rv-next" hidden>${idx+1<total?"下一題":"看成績"}</button></div>`);
    const done=(ok,html)=>{$("#rv-res").innerHTML=`<div class="${ok?"res-ok":"res-no"}">${html}</div>`;$("#rv-next").hidden=false;$("#rv-next").focus();
      if(ok){score++;S.wrong=S.wrong.filter(w=>w.key!==it.key);day().correct++;if(it.t==="gen")S.st.genOk++;else S.st.mcOk++;if(book)S.st.fixOk++;addCoins(10+(it.t==="gen"&&S.job==="act"?5:0));gainXP(10)}else{sfx.wrong();noteWrong(it);if(!S.wrong.some(w=>w.key===it.key))S.wrong.push(Object.assign({},it))}save()};
    if(it.t==="mc"){const q=Q[it.id][it.k];
      $("#sheet").querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{const j=+b.dataset.o;
        $("#sheet").querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.o===q[2])x.classList.add("right")});if(j!==q[2])b.classList.add("wrong");
        done(j===q[2],(j===q[2]?"<strong>答對了。</strong>":`<strong>正確答案是「${q[1][q[2]]}」。</strong>`)+"<br>"+q[3]+(q[4]?keysHTML(q[4]):""))}))}
    else{if(!it.key)it.key="g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      const go=()=>{const v=parseFloat($("#rv-in").value.replace(/[,，\s元%倍億]/g,""));if(isNaN(v)){$("#rv-in").focus();return}
        $("#rv-in").disabled=true;$("#rv-go").disabled=true;const ok=tolOK(v,it);
        done(ok,(ok?"<strong>答對了。</strong>":`<strong>正確答案是 ${it.a.toLocaleString("zh-TW",{minimumFractionDigits:it.d,maximumFractionDigits:it.d})} ${it.u}。</strong>`)+"<br>"+it.how+(it.keys?keysHTML(it.keys):""))};
      $("#rv-go").addEventListener("click",go);$("#rv-in").addEventListener("keydown",e=>{if(e.key==="Enter")go()});setTimeout(()=>$("#rv-in")&&$("#rv-in").focus(),60)}
    $("#rv-quit").addEventListener("click",()=>{closeModal();if(sel)renderPanel()});
    $("#rv-next").addEventListener("click",()=>{idx++;idx<total?show():finish()});
  };
  show();
}

/* ---------- quest log ---------- */
let qTab="main";
function questLog(){
  const tabsH=[["main","主線"],["comm","委託"],["daily","每日"],["ach","成就"],["boss","頭目"]];let body="";
  if(qTab==="comm")body=COMM.map(c=>{const n=NPCS[c.npc],m=cmS(c),op=isOpen(n.isl);const stt=m&&m.done?"done":m?"cur":"";
    return `<div class="qrow ${stt}"><div class="qhead"><strong>${op?c.t:"？？？"}</strong><span class="rar r${c.r}">${RAR[c.r]}</span></div><div class="qmeta"><span>${!op?`第 ${n.isl} 島 ${md(n.isl)} 開放`:m&&m.done?`已完成 · ${m.done}`:m?stepHint(c):cmAvail(c)?`到第 ${n.isl} 島找${n.nm}接委託`:c.lv&&lvl(S.xp).L<c.lv?`Lv ${c.lv} 才能接`:`等更多島嶼開放`}</span>${op&&!(m&&m.done)?`<button class="btn xs" data-go="${m&&curStep(c).k==="go"?curStep(c).to:n.isl}">前往</button>`:""}</div></div>`}).join("");
  if(qTab==="main"){body=MAIN.map((m,k)=>{const st=k<S.mainIdx?"done":k===S.mainIdx?"cur":"todo",[xp,c]=mReward(m);
      if(st!=="cur")return `<div class="qrow ${st}"><div class="qhead"><strong>${k+1}. ${st==="todo"?"？？？":m.t}</strong><span class="qtag ${st==="done"?"ok":""}">${st==="done"?"完成":"未解鎖"}</span></div></div>`;
      const dn=mainDone(m);let btn;
      if(dn)btn=`<button class="btn gold xs" data-mclaim>領取 ${xp} XP · ${c} 金幣</button>`;
      else if(m.boss){const b=BOSS.find(x=>x.id===m.boss);btn=bossVisible(b)?`<button class="btn xs" data-bossgo="${b.id}">查看頭目</button>`:""}
      else{const tgt=m.go||(m.isl||[]).find(id=>isOpen(id)&&!S.stamps[id]);btn=tgt?`<button class="btn xs" data-go="${tgt}">前往第 ${tgt} 島</button>`:""}
      return `<div class="qrow cur"><div class="qhead"><strong>${k+1}. ${m.t}</strong><span class="qtag">進行中</span></div><div class="npc">${CAPTAIN}<span>${m.st}</span></div><div class="qmeta"><span>${dn?"任務完成了。":mainGoal(m)}</span>${btn}</div></div>`}).join("")}
  if(qTab==="daily"){const d=day(),ds=dailies();
    body=ds.map(x=>{const v=Math.min(d[x[0]],x[2]),cl=d.claimed[x[0]],dn=v>=x[2];
      return `<div class="qrow ${cl?"done":""}"><div class="qhead"><strong>${x[1]}</strong><span class="qtag ${cl?"ok":""}">${cl?"已領取":v+" / "+x[2]}</span></div><div class="bar"><span style="width:${v/x[2]*100}%"></span></div><div class="qmeta"><span>獎勵 40 XP · 20 金幣</span>${dn&&!cl?`<button class="btn gold xs" data-dclaim="${x[0]}">領取</button>`:""}</div></div>`}).join("")
      +`<div class="qrow"><div class="qhead"><strong>每日寶箱</strong><span class="qtag ${d.bonus?"ok":""}">${d.bonus?"已領取":ds.filter(x=>d.claimed[x[0]]).length+" / 3"}</span></div><div class="qmeta"><span>三個每日任務都領完，再送 60 金幣。你已經連續登島 ${S.streak||1} 天。</span></div></div>`}
  if(qTab==="ach")body=ACH.map(a=>{const v=Math.min(a[4](),a[3]),cl=S.ach[a[0]],dn=v>=a[3];
    return `<div class="qrow ${cl?"done":""}"><div class="qhead"><strong>${a[1]}</strong><span class="qtag ${cl?"ok":""}">${cl?"已達成":v+" / "+a[3]}</span></div><span class="hint" style="font-size:.86rem">${a[2]}</span><div class="bar"><span style="width:${v/a[3]*100}%"></span></div><div class="qmeta"><span>獎勵 ${a[5]} XP · ${a[6]} 金幣</span>${dn&&!cl?`<button class="btn gold xs" data-aclaim="${a[0]}">領取</button>`:""}</div></div>`}).join("");
  if(qTab==="boss")body=BOSS.map(b=>{const v=bossVisible(b),r=bossReady(b),w=S.bossWin[b.id];
    return `<div class="qrow ${w?"done":""}" style="grid-template-columns:auto 1fr;align-items:center">${bossSVG(b,54,!!w)}<div style="display:grid;gap:4px;min-width:0"><div class="qhead"><strong>${v?b.nm:"？？？"}</strong><span class="qtag ${w?"ok":""}">${w?"已擊敗":r?"可以挑戰":v?"準備中":"未出現"}</span></div><div class="qmeta"><span>${b.fin?"需要九座島的印章":"需要第 "+b.isl.join("、")+" 島印章"} · 生命 ${b.hp}</span>${v?`<button class="btn xs ${r?"":"ghost"}" data-bossgo="${b.id}">${w?"再戰":r?"挑戰":"查看"}</button>`:""}</div></div></div>`}).join("");
  const lv=lvl(S.xp);
  modal(`<div class="qhead"><h2>任務</h2><span class="hint">Lv ${lv.L} ${titleOf(lv.L)} · 生命 ${maxHearts()} · 傷害 ${dmgBase()}</span></div>
   <div class="tabs" style="margin:0">${tabsH.map(t=>`<button data-qt="${t[0]}" aria-selected="${t[0]===qTab}">${t[1]}</button>`).join("")}</div>
   <div class="qlist">${body}</div><div class="row"><button class="btn" id="ql-x">關閉</button></div>`);
  $("#ql-x").addEventListener("click",closeModal);
  $("#sheet").querySelectorAll("[data-qt]").forEach(b=>b.addEventListener("click",()=>{qTab=b.dataset.qt;sfx.tap();questLog()}));
  $("#sheet").querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{closeModal();select(+b.dataset.go)}));
  $("#sheet").querySelectorAll("[data-bossgo]").forEach(b=>b.addEventListener("click",()=>bossIntro(b.dataset.bossgo)));
  const mc=$("#sheet").querySelector("[data-mclaim]");if(mc)mc.addEventListener("click",e=>{const m=MAIN[S.mainIdx],[xp,c]=mReward(m);S.mainIdx++;save();addCoins(c,e.clientX,e.clientY);gainXP(xp);sfx.stamp();questLog()});
  $("#sheet").querySelectorAll("[data-dclaim]").forEach(b=>b.addEventListener("click",e=>{const d=day();d.claimed[b.dataset.dclaim]=1;save();addCoins(20,e.clientX,e.clientY);gainXP(40);
    if(!d.bonus&&dailies().every(x=>d.claimed[x[0]])){d.bonus=1;S.coins+=60;save();hud("co");toast("每日寶箱","<span>今天的三個每日任務都完成了，再送你 60 金幣。明天見。</span>")}questLog()}));
  $("#sheet").querySelectorAll("[data-aclaim]").forEach(b=>b.addEventListener("click",e=>{const a=ACH.find(x=>x[0]===b.dataset.aclaim);S.ach[a[0]]=1;save();addCoins(a[6],e.clientX,e.clientY);gainXP(a[5]);sfx.stamp();toast(`達成成就 · ${a[1]}`,`<span>${a[2]}，獲得 ${a[5]} XP 和 ${a[6]} 金幣。</span>`);questLog()}));
  renderTracker();
}

const cmS=c=>S.cm[c.id];
const curStep=c=>c.steps[Math.min((cmS(c)||{s:0}).s,c.steps.length-1)];
const stepNpc=c=>curStep(c).npc||c.npc;
const cmActive=c=>cmS(c)&&!cmS(c).done&&cmS(c).s<c.steps.length;
const cmAvail=c=>!cmS(c)&&isOpen(NPCS[c.npc].isl)&&(!c.lv||lvl(S.xp).L>=c.lv)&&(!c.need||c.need.every(id=>isOpen(id)));
const TALK=["calc","choice","say","timed"];
function npcMark(nid){
  if(COMM.some(c=>cmActive(c)&&stepNpc(c)===nid&&TALK.includes(curStep(c).k)))return "!";
  if(COMM.some(c=>cmActive(c)&&curStep(c).k==="go"&&curStep(c).npc===nid))return "?";
  if(COMM.some(c=>c.npc===nid&&cmAvail(c)))return "!";return ""}
function stepHint(c){const st=curStep(c);

  if(st.k==="find")return `在第 ${[...new Set(st.on)].join("、")} 島找${st.item}（${(cmS(c).f||[]).length} / ${st.n}）`;
  return `回去找第 ${NPCS[stepNpc(c)].isl} 島的${NPCS[stepNpc(c)].nm}`}
function npcSVG(nid,size=56){const n=NPCS[nid];if(nid==="captain")return CAPTAIN.replace('width="44" height="44"',`width="${size}" height="${size}"`);
  return `<svg width="${size}" height="${size}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="40" r="14" fill="${n.col}"/><circle cx="22" cy="20" r="12" fill="#f1c7a0"/>${nid==="grandma"?'<path d="M10 18a12 12 0 0 1 24 0c-3-4-7-5-12-5s-9 1-12 5z" fill="#d8d8d8"/><circle cx="22" cy="7" r="4" fill="#d8d8d8"/>':`<path d="M10 18a12 12 0 0 1 24 0c-4-3-8-4-12-4s-8 1-12 4z" fill="#2b2018"/>`}<circle cx="17.5" cy="21" r="1.5" fill="#2b2018"/><circle cx="26.5" cy="21" r="1.5" fill="#2b2018"/><path d="M18 26q4 3 8 0" stroke="#2b2018" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`}
function dlg(nid,text,body="",btns=""){const n=NPCS[nid];
  modal(`<div class="dlg-who">${npcSVG(nid)}<div><strong>${n.nm}</strong><small>${n.role} · 第 ${n.isl} 島</small></div></div><div class="bubble">${text}</div>${body}<div class="row">${btns}</div>`)}
function talk(nid){
  const act=COMM.find(c=>cmActive(c)&&stepNpc(c)===nid&&TALK.includes(curStep(c).k));if(act)return runStep(act);
  const gt=COMM.find(c=>cmActive(c)&&curStep(c).k==="go"&&curStep(c).npc===nid);
  if(gt){dlg(nid,`我在第 ${NPCS[nid].isl} 島等你，走過來找我吧。`,"",`<button class="btn" id="d-x">好</button>`);$("#d-x").addEventListener("click",()=>{closeModal();select(NPCS[nid].isl)});return}
  const fd=COMM.find(c=>cmActive(c)&&curStep(c).k==="find"&&c.npc===nid);
  if(fd){dlg(nid,`還有 ${curStep(fd).n-(cmS(fd).f||[]).length} 個${curStep(fd).item}沒找到，${stepHint(fd)}。在島上仔細看看，它們會發光喔。`,"",`<button class="btn" id="d-x">好</button>`);$("#d-x").addEventListener("click",closeModal);return}
  const av=COMM.find(c=>c.npc===nid&&cmAvail(c));if(av)return offer(av);
  const lk=COMM.find(c=>c.npc===nid&&!cmS(c));
  const msg=lk&&lk.lv&&lvl(S.xp).L<lk.lv?`等你升到 Lv ${lk.lv}，我有一件重要的事要拜託你。`:lk&&lk.need&&!lk.need.every(id=>isOpen(id))?"等更多島嶼浮出海面，我再告訴你一個祕密。":NPCS[nid].idle;
  dlg(nid,msg,"",`<button class="btn" id="d-x">好</button>`);$("#d-x").addEventListener("click",closeModal)}
function offer(c){const [xp,co]=RREW[c.r];
  dlg(c.npc,c.steps[0].ask,`<div class="qmeta"><span class="rar r${c.r}">${RAR[c.r]}委託 · ${c.t}</span><span>獎勵 ${xp} XP · ${co} 金幣${c.prize?" · 神祕獎品":""}</span></div>`,
    `<button class="btn ghost" id="d-no">之後再說</button><button class="btn" id="d-yes">接受委託</button>`);
  $("#d-no").addEventListener("click",closeModal);
  $("#d-yes").addEventListener("click",()=>{S.cm[c.id]={s:0,f:[]};save();sfx.coin();if(api)api.refreshNPC();const st=curStep(c);
    if(TALK.includes(st.k)&&st.k!=="say")runStep(c,true);else if(st.k==="say")advance(c);else{closeModal();guide(c)}})}
function guide(c){toast(`委託 · ${c.t}`,`<span>${stepHint(c)}。</span>`,7000);renderTracker()}
function advance(c){const m=cmS(c);m.s++;m.f=[];save();
  if(m.s>=c.steps.length)return complete(c);
  if(api)api.refreshNPC();
  const st=curStep(c);if(TALK.includes(st.k)&&stepNpc(c)===(c.steps[m.s-1].npc||c.npc))return runStep(c);
  closeModal();guide(c)}
function runStep(c,skipAsk){const st=curStep(c),nid=stepNpc(c);
  if(st.k==="say"){dlg(nid,st.ask,"",`<button class="btn" id="d-go">繼續</button>`);$("#d-go").addEventListener("click",()=>advance(c));return}
  if(st.k==="choice"){dlg(nid,st.ask,`<div class="opts">${st.opts.map((o,j)=>`<button class="opt" data-j="${j}">${o[0]}</button>`).join("")}</div>`,"");
    $("#sheet").querySelectorAll("[data-j]").forEach(b=>b.addEventListener("click",()=>{const o=st.opts[+b.dataset.j];if(!o[1])cmS(c).bad=1;else S.st.mcOk++;save();o[1]?sfx.coin():sfx.tap();
      dlg(nid,o[2],"",`<button class="btn" id="d-go">繼續</button>`);$("#d-go").addEventListener("click",()=>advance(c))}));return}
  if(st.k==="timed"){dlg(nid,st.ask,`<p class="hint" style="margin:0">限時 ${st.sec+20*sk("calm")} 秒，要答對 ${st.n} 題。答錯會換一題，但時間會繼續跑。</p>`,`<button class="btn ghost" id="d-x">還沒準備好</button><button class="btn" id="d-go">開始</button>`);
    $("#d-x").addEventListener("click",closeModal);$("#d-go").addEventListener("click",()=>timed(c,st));return}
  // calc
  dlg(nid,st.ask,`<div class="qbox"><p style="font-weight:700;margin:0">${st.q}</p><div class="num"><input id="rv-in" inputmode="decimal" placeholder="輸入答案" autocomplete="off" aria-label="答案"><span>${st.u}</span><button class="btn" id="rv-go">送出</button></div><p class="hint" style="margin:0">四捨五入到小數第 ${st.d} 位。</p><div id="rv-res"></div></div>`,`<button class="btn ghost" id="d-x">等一下再算</button><button class="btn" id="d-go" hidden>繼續</button>`);
  let tries=0;const go=()=>{const v=parseFloat($("#rv-in").value.replace(/[,，\s元%倍億]/g,""));if(isNaN(v)){$("#rv-in").focus();return}
    if(tolOK(v,st)){$("#rv-in").disabled=true;$("#rv-go").disabled=true;S.st.cmCalc=(S.st.cmCalc||0)+1;save();sfx.coin();
      $("#rv-res").innerHTML=`<div class="res-ok"><strong>${st.ok||"答對了，太感謝你了！"}</strong><br>${st.how}${st.keys?keysHTML(st.keys):""}</div>`;$("#d-go").hidden=false;$("#d-go").focus()}
    else{tries++;sfx.wrong();$("#rv-res").innerHTML=`<div class="res-no">好像不太對，再算一次看看？${tries>=1?`<br>提示：${st.hint}`:""}${tries>=3&&st.keys?keysHTML(st.keys):""}</div>`;$("#rv-in").select()}};
  $("#rv-go").addEventListener("click",go);$("#rv-in").addEventListener("keydown",e=>{if(e.key==="Enter")go()});setTimeout(()=>$("#rv-in")&&$("#rv-in").focus(),60);
  $("#d-x").addEventListener("click",closeModal);$("#d-go").addEventListener("click",()=>advance(c))}
let timedTok=0;
function timed(c,st){const tok=++timedTok,total=st.sec+20*sk("calm"),end=Date.now()+total*1000;let ok=0;
  const tick=setInterval(()=>{if(tok!==timedTok){clearInterval(tick);return}const left=Math.max(0,(end-Date.now())/1000),lb=$("#tm-left"),bar=$("#tm-bar");
    if(lb)lb.textContent=`剩下 ${Math.ceil(left)} 秒`;if(bar)bar.style.width=(left/total*100)+"%";
    if(left<=0){clearInterval(tick);timedTok++;sfx.wrong();dlg(c.npc,`時間到了……沒關係，客人說可以再等一下。準備好再來找我。`,"",`<button class="btn" id="d-x">好</button>`);$("#d-x").addEventListener("click",closeModal)}},250);
  const next=()=>{const it=Object.assign({t:"gen",id:st.isl},GEN[st.isl]());
    modal(`<div class="rv-top"><span>${c.t} · 已答對 ${ok} / ${st.n}</span><span id="tm-left"></span></div><div class="bar"><span id="tm-bar" style="width:100%;transition:width .25s linear"></span></div>${qHTML(it)}<div id="rv-res"></div>
      <div class="row"><button class="btn ghost" id="tm-x">放棄</button><button class="btn" id="tm-next" hidden>下一題</button></div>`);
    $("#tm-x").addEventListener("click",()=>{timedTok++;clearInterval(tick);closeModal()});
    wireQ(it,(good,exp)=>{if(tok!==timedTok)return;if(good){ok++;S.st.genOk++;save();sfx.coin()}else sfx.wrong();
      $("#rv-res").innerHTML=`<div class="${good?"res-ok":"res-no"}"><strong>${good?"答對了！":"不對，換下一題。"}</strong><br>${exp}</div>`;
      if(ok>=st.n){timedTok++;clearInterval(tick);const left=Math.max(0,Math.round((end-Date.now())/1000));
        setTimeout(()=>{dlg(c.npc,`全部算完了，還剩 ${left} 秒！客人很滿意，你比計算機還快。`,"",`<button class="btn" id="d-go">繼續</button>`);$("#d-go").addEventListener("click",()=>advance(c))},900)}
      else{const nx=$("#tm-next");nx.hidden=false;nx.focus();nx.addEventListener("click",next)}})};
  next()}
function complete(c){const m=cmS(c),d=new Date(),[xp0,co0]=RREW[c.r],half=m.bad?.5:1,xp=Math.round(xp0*half),co=Math.round(co0*half);
  m.done=`${d.getMonth()+1}/${d.getDate()}`;S.st.cmDone=(S.st.cmDone||0)+1;
  if(c.prize){S.owned[c.prize]=1;if(c.prize==="h-pirate"){S.hat="pirate";if(api)api.dress(S.color,S.hat)}}
  save();sfx.stamp();if(api)api.refreshNPC();
  modal(`<div class="dlg-who">${npcSVG(c.npc)}<div><strong>委託完成</strong><small>${NPCS[c.npc].nm} · ${c.t}</small></div></div>
    <div class="qmeta"><span class="rar r${c.r}">${RAR[c.r]}委託</span><span>獲得 ${xp} XP · ${co} 金幣${c.prize==="h-pirate"?" · 海盜帽（已經戴上了）":""}</span></div>
    ${m.bad?`<p class="hint">這次的選擇不是最好的，獎勵減半。觀念弄懂了，下一個委託就能拿滿分。</p>`:""}
    <div class="row"><button class="btn" id="d-ok">好</button></div>`);
  $("#d-ok").addEventListener("click",closeModal);
  setTimeout(()=>{S.coins+=Math.round(co*coinMul());save();hud("co");gainXP(xp)},300)}
function onArrive(isl){const c=COMM.find(c=>cmActive(c)&&curStep(c).k==="go"&&curStep(c).to===isl);if(!c)return;
  if(!$("#modal").hidden){setTimeout(()=>onArrive(isl),1500);return}
  const st=curStep(c);dlg(st.npc,st.arrive,"",`<button class="btn" id="d-go">繼續</button>`);$("#d-go").addEventListener("click",()=>advance(c))}
function collectItem(cid,idx){const c=COMM.find(x=>x.id===cid),m=cmS(c);if(!m||m.done||curStep(c).k!=="find"||m.f.includes(idx))return;

function radarSVG(st){const N=st.length,cx=130,cy=118,R0=82,pt=(k,r)=>{const a=-Math.PI/2+k*2*Math.PI/N;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  const ring=f=>st.map((_,k)=>pt(k,R0*f).join(",")).join(" ");
  return `<svg class="radar" width="260" height="240" viewBox="0 0 260 240" aria-hidden="true">${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--rule)" stroke-width="1.2"/>`).join("")}
   ${st.map((_,k)=>{const[x,y]=pt(k,R0);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--rule)"/>`}).join("")}
   <polygon points="${st.map((x,k)=>pt(k,R0*Math.max(.04,x[1]/100)).join(",")).join(" ")}" fill="rgba(138,92,194,.28)" stroke="#8a5cc2" stroke-width="2.5" stroke-linejoin="round"/>
   ${st.map((x,k)=>{const[px,py]=pt(k,R0*Math.max(.04,x[1]/100));return `<circle cx="${px}" cy="${py}" r="4" fill="#8a5cc2"/>`}).join("")}
   ${st.map((x,k)=>{const[px,py]=pt(k,R0+20);return `<text x="${px}" y="${py+4}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="Noto Sans TC,sans-serif">${x[0]}</text>`}).join("")}</svg>`}

  modal(`<div class="qhead"><h2>${esc(S.name||"探險家")}</h2><span class="lv" style="font-size:.9rem">Lv ${lv.L}</span></div>
   <p class="hint" style="margin-top:-6px">${titleOf(lv.L)}${S.job?" · "+JOBS[S.job].nm:""} · 生命 ${maxHearts()} · 傷害 ${dmgBase()} · 會心一擊 ${critMul()} 倍</p>
   <h3>能力值</h3>${radarSVG(st)}

   <h3>職業</h3>${jobH}

   <div style="display:grid;gap:6px">${SKILLS.map(x=>`<div class="skill"><strong>${x[1]}</strong><span class="pips">${Array.from({length:x[3]},(_,k)=>`<i class="${k<sk(x[0])?"on":""}"></i>`).join("")}</span><small>${x[2]}</small>${sk(x[0])<x[3]?`<button class="btn xs" data-sk="${x[0]}" ${freePts()?"":"disabled"}>+1</button>`:`<span class="hint" style="font-size:.8rem">已滿級</span>`}</div>`).join("")}</div>
   <p class="hint">每升一級得到 1 點技能點。${spentPts()?"想重新分配可以花 100 金幣重置。":""}</p>
   <div class="row">${spentPts()?`<button class="btn ghost" id="sk-reset" ${S.coins<100?"disabled":""}>重置技能 100 金幣</button>`:""}<button class="btn" id="ch-x">關閉</button></div>`);
  $("#ch-x").addEventListener("click",closeModal);
  $("#sheet").querySelectorAll("[data-sk]").forEach(b=>b.addEventListener("click",()=>{if(!freePts())return;S.skills[b.dataset.sk]=sk(b.dataset.sk)+1;save();hud();sfx.coin();charSheet()}));

      br.planks.forEach(p=>{if(p.userData.drop>0){p.userData.drop=Math.max(0,p.userData.drop-dt*1.8);const d=Math.min(1,p.userData.drop);p.position.y=p.userData.y0+4*d*d}});
      const k=(Math.sin(t*(br.hot?1.4:.6)+br.orb.userData.phase)+1)/2;br.orb.position.copy(br.curve.getPointAt(k));br.orb.position.y+=.45;br.orb.scale.setScalar(br.hot?1.5:1);br.orb.material.color.set(br.hot?"#ff9a5c":"#ffd36b")});
    I.forEach(i=>{const o=isleObj[i.id],wantR=vis[i.id]?1:0;
      if(o.rise!==wantR){o.rise=Math.max(0,Math.min(1,o.rise+(wantR?1:-1)*dt*.42));if(o.rise>=1){o.shroud.visible=false;o.lock.visible=false}}
      const kr=1-Math.pow(1-o.rise,3);o.grp.position.y=-6*(1-kr)+(o.rise<1?Math.sin(t*.8+i.id)*.15:0);
      if(o.shroud.visible){o.shroud.scale.setScalar(Math.max(.01,1-kr));o.shroud.rotation.y=t*.08}
      if(o.lock.visible){o.lock.position.y=4.5+kr*9;o.lock.rotation.y=t*.9;o.lock.scale.setScalar(1.2*(1-kr*.9))}
      const want=sel===i.id?.75+Math.sin(t*3)*.2:(hover===i.id?.45:0);o.ring.material.opacity+=(want-o.ring.material.opacity)*.15;
      o.gring.material.opacity+=((S.stamps[i.id]?.85:0)-o.gring.material.opacity)*.08;
      bldObj[i.id].forEach(b=>{if(b.userData.pulse>0){b.userData.pulse=Math.max(0,b.userData.pulse-dt*.8);b.scale.setScalar(b.userData.base*(1+Math.sin(b.userData.pulse*Math.PI*4)*.18*b.userData.pulse))}});
      const bn=bannerObj[i.id];if(bn.g.visible&&bn.t<1){bn.t=Math.min(1,bn.t+dt*.6);const k=1-Math.pow(1-bn.t,3);bn.g.position.y=-5+5*k}
      const ch=chestObj[i.id],lid=ch.g.userData.lid,glow=ch.g.userData.glow;
      if(ch.t>0&&ch.t<1){ch.t=Math.min(1,ch.t+dt*1.6);lid.rotation.x=-1.9*(1-Math.pow(1-ch.t,3))}
      glow.material.opacity=S.chests[i.id]?0:(.18+Math.sin(t*3+i.id)*.12);ch.g.position.y=S.chests[i.id]?0:Math.abs(Math.sin(t*2.4+i.id))*.12});
    for(let k=bursts.length-1;k>=0;k--){const b=bursts[k];b.t+=dt;const p=b.pts.geometry.attributes.position.array;
      b.v.forEach((v,j)=>{v.y-=7*dt;v.multiplyScalar(1-dt*.6);p[j*3]+=v.x*dt;p[j*3+1]+=v.y*dt;p[j*3+2]+=v.z*dt});b.pts.geometry.attributes.position.needsUpdate=true;
      b.pts.material.opacity=Math.max(0,1-b.t/b.life);if(b.t>b.life){scene.remove(b.pts);b.pts.geometry.dispose();b.pts.material.dispose();bursts.splice(k,1)}}
    if(mpos&&mpos[2]==="mouse"&&!down){const h=hit(mpos[0],mpos[1]);hover=h&&h.bridge==null?h.isle:null;cv.style.cursor=h&&(h.isle!=null||h.chest||h.boss||h.npc||h.item)?"pointer":"";showTip(h,mpos[0],mpos[1])}
    renderer.render(scene,camera);
    const r=$("#app").getBoundingClientRect();
    bridges.forEach((br,n)=>{const m=bmarks[n];const on=br.g.visible&&!S.fixed[n];if(m.hidden===on)m.hidden=!on;if(!on)return;tmp.copy(br.curve.getPointAt(.5));tmp.y+=1.5;tmp.project(camera);if(tmp.z>1){m.style.visibility="hidden";return}m.style.visibility="";m.style.left=((tmp.x+1)/2*r.width)+"px";m.style.top=((1-tmp.y)/2*r.height)+"px"});
    I.forEach((i,k)=>{tmp.copy(P[i.id]);tmp.y=isleObj[i.id].grp.position.y+(vis[i.id]?(S.stamps[i.id]?5.6:4.7):7.2);tmp.project(camera);const Lb=labels[k];if(tmp.z>1){Lb.style.visibility="hidden";return}Lb.style.visibility="";Lb.style.left=((tmp.x+1)/2*r.width)+"px";Lb.style.top=((1-tmp.y)/2*r.height)+"px"});
    tmp.copy(walker.position);tmp.y+=2.3;tmp.project(camera);nameTag.style.left=((tmp.x+1)/2*r.width)+"px";nameTag.style.top=((1-tmp.y)/2*r.height)+"px";nameTag.style.visibility=tmp.z>1?"hidden":"";
    requestAnimationFrame(loop);
  }
  loop();
  refreshDecor();bossRefresh();refreshNPC();
  if(FRESH.length)setTimeout(()=>FRESH.forEach((id,k)=>setTimeout(()=>api.unlock(id),k*1600)),2600);
})();

function fallback(){
  if(!PREVIEW){FRESH.forEach(id=>S.seen[id]=1);save()}
  labels.forEach(l=>l.hidden=true);nameTag.hidden=true;
  toast("這台裝置無法顯示立體地圖","<span>已切換成清單模式，一樣可以讀觀念、玩實驗室、闖關蓋印章。</span>",6000);
  renderList();$("#list").hidden=false;$("#b-list").setAttribute("aria-pressed","true");
}
if(!S.name||(SYNC_URL&&!(S.sid&&S.ph)))setTimeout(()=>setup(true),900);
</script>
